<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>우리집 가계부 · 2026</title>
<style>
:root{
  --bg:#f4f6fa; --bg2:#ffffff; --card:#ffffff; --ink:#101828; --ink2:#5a6478; --line:#e6e9f0;
  --accent:#2f6bff; --accent2:#12b886; --warn:#e8590c; --danger:#e03131;
  --pos:#0ca678; --neg:#e8590c;
  --shadow:0 2px 10px rgba(16,24,40,.06), 0 12px 32px rgba(16,24,40,.05);
  --radius:18px;
}
html[data-theme="dark"]{
  --bg:#0a0e15; --bg2:#0f151f; --card:#121a26; --ink:#eef2f8; --ink2:#93a0b4; --line:#1f2a38;
  --accent:#5b8dff; --accent2:#2fd6a0; --warn:#ff8a3d; --danger:#ff6b6b;
  --pos:#2fd6a0; --neg:#ff8a3d;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]){--bg:#0a0e15;--bg2:#0f151f;--card:#121a26;--ink:#eef2f8;--ink2:#93a0b4;--line:#1f2a38;--accent:#5b8dff;--accent2:#2fd6a0;--warn:#ff8a3d;--danger:#ff6b6b;--pos:#2fd6a0;--neg:#ff8a3d;--shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.35)}}
h1,h2,h3{margin:0;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ───────── 로그인 ───────── */
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 20% -10%, rgba(47,107,255,.18), transparent 60%),
             radial-gradient(900px 500px at 90% 110%, rgba(18,184,134,.14), transparent 60%), var(--bg);}
.lockCard{width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);border-radius:24px;
  padding:32px 26px 26px;box-shadow:var(--shadow)}
.mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;margin-bottom:18px}
.lockCard h1{font-size:22px;margin-bottom:6px}
.lockCard .sub{color:var(--ink2);font-size:13.5px;margin-bottom:24px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg2);outline:none;transition:.15s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
.btnPrimary{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(135deg,var(--accent),#4a86ff);margin-top:8px;transition:.15s}
.btnPrimary:active{transform:translateY(1px)}
.btnPrimary:disabled{opacity:.6}
.msg{min-height:20px;font-size:12.5px;color:var(--danger);margin-top:10px;text-align:center}
.lockFoot{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink2);text-align:center;line-height:1.6}

/* ───────── 앱 셸 ───────── */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 18px 12px;background:var(--bg);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.brand strong{display:block;font-size:15.5px;letter-spacing:-.02em}
.brand small{color:var(--ink2);font-size:11.5px}
.topActions{display:flex;gap:8px}
.iconBtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.tabs{position:sticky;top:57px;z-index:19;display:flex;gap:6px;padding:8px 14px;overflow:auto;
  background:var(--bg);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:transparent;padding:9px 14px;border-radius:999px;
  font-size:13.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.tabs button.active{background:var(--ink);color:var(--bg)}
html[data-theme="dark"] .tabs button.active{background:var(--accent);color:#fff}
main{padding:16px 14px 40px;max-width:1080px;margin:0 auto}
.grid{display:grid;gap:12px}
@media(min-width:720px){.grid.cols2{grid-template-columns:1fr 1fr}.grid.cols4{grid-template-columns:repeat(4,1fr)}}
@media(max-width:719px){.grid.cols4{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:14px;margin-bottom:2px}
.card .hint{font-size:11.5px;color:var(--ink2);margin-bottom:14px}
.kpi .label{font-size:12px;color:var(--ink2);font-weight:600}
.kpi .value{font-size:clamp(17px,4.8vw,23px);font-weight:800;letter-spacing:-.04em;margin-top:4px;white-space:nowrap}
.kpi .meta{font-size:11.5px;color:var(--ink2);margin-top:6px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.sec{margin-top:14px}
.secHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:20px 2px 10px}
.secHead h2{font-size:15.5px}
.secHead span{font-size:11.5px;color:var(--ink2)}

/* 범례 / 리스트 */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink2);margin-top:10px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;color:var(--ink2);font-size:11px}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.track{flex:1}

/* 월 선택 */
.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:13px;font-weight:700;color:var(--ink2)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* 표 */
.tableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tx{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
table.tx th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11px;color:var(--ink2);
  font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.tx td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.tx td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
table.tx td .cat{color:var(--ink2);font-size:11px;display:block}
.pill{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10.5px;font-weight:700;
  background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--accent);white-space:nowrap}
.pill.gray{background:color-mix(in srgb, var(--ink2) 14%, transparent);color:var(--ink2)}
.pill.green{background:color-mix(in srgb, var(--pos) 14%, transparent);color:var(--pos)}
.filters{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin:10px 0 6px}
@media(min-width:720px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}}
.filters input,.filters select{padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-size:12.5px;width:100%;min-width:0}
@media(max-width:719px){.filters #fq{grid-column:1/-1}}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--ink2)}
.pager button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700}
.pager button:disabled{opacity:.4}
.totline{display:flex;justify-content:space-between;font-size:12.5px;padding:10px 2px 0;border-top:1px solid var(--line);margin-top:8px}
.totline b{font-variant-numeric:tabular-nums}

/* 안내 */
.notice{border-left:3px solid var(--warn);background:color-mix(in srgb, var(--warn) 9%, transparent);
  padding:12px 14px;border-radius:12px;font-size:12.5px;color:var(--ink);line-height:1.6}
.notice b{color:var(--warn)}
details{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
details summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink2)}
details p,details li{font-size:12px;color:var(--ink2);line-height:1.65}
details ul{padding-left:18px;margin:8px 0 0}
.foot{text-align:center;font-size:11px;color:var(--ink2);padding:8px 20px 30px}
.mini{display:flex;gap:2px;align-items:flex-end;height:26px}
.mini i{width:4px;background:var(--accent);border-radius:1px;display:block;min-height:1px;opacity:.85}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:inherit;font-variant-numeric:tabular-nums}
.tip{position:fixed;pointer-events:none;z-index:99;background:var(--ink);color:var(--bg);font-size:11.5px;
  padding:6px 9px;border-radius:8px;opacity:0;transition:opacity .12s;white-space:nowrap}
</style>
</head>
<body>
<div id="lock" class="lock">
  <div class="lockCard">
    <div class="mark">₩</div>
    <h1>우리집 가계부</h1>
    <div class="sub" id="lockSub">2026년 1~11월 · 암호화된 기록</div>
    <form id="loginForm" autocomplete="off">
      <div class="field"><label for="uid">아이디</label><input id="uid" name="uid" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" required></div>
      <div class="field"><label for="pw">비밀번호</label><input id="pw" name="pw" type="password" required></div>
      <button class="btnPrimary" id="loginBtn" type="submit">열기</button>
      <div class="msg" id="loginMsg" role="status"></div>
    </form>
    <div class="lockFoot">아이디와 비밀번호는 이 기기 밖으로 전송되지 않습니다.<br>입력값으로만 잠금을 풀고, 틀리면 아무것도 열리지 않습니다.</div>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><span class="dot"></span><div><strong>우리집 가계부</strong><small id="hdrSub">2026년 1~11월</small></div></div>
    <div class="topActions">
      <button class="iconBtn" id="themeBtn" title="테마">◐</button>
      <button class="iconBtn" id="lockBtn">잠금</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="annual" class="active">연간 한눈에</button>
    <button data-tab="month">월별 상세</button>

  <main>

  </main>
  <div class="foot">AES-256-GCM 암호화 · 화면을 닫으면 다시 잠깁니다</div>
</div>
<div class="tip" id="tip"></div>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const NF = new Intl.NumberFormat('ko-KR');
const won = n => NF.format(Math.round(n || 0)) + '원';
const num = n => NF.format(Math.round(n || 0));
const pct = (v, digits = 1) => (v * 100).toFixed(digits).replace(/\.0$/, '') + '%';
function short(n) {
  const a = Math.abs(n);
  if (a >= 1e8) return (n / 1e8).toFixed(a >= 1e10 ? 0 : 1).replace(/\.0$/, '') + '억';
  if (a >= 1e4) return Math.round(n / 1e4) + '만';
  return String(Math.round(n));
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const b64ToBytes = b64 => { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
const MONTHS = META.months;

function initTheme() {
  const saved = localStorage.getItem('bd-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  $('#themeBtn').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
    if (next) document.documentElement.setAttribute('data-theme', next);
    else document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('bd-theme', next);
  };
}

/* ── 잠금 해제 ───────────────────────────────────────── */
let DATA = null, lockTimer = null;

async function unlock(id, pw) {
  if (!(window.crypto && window.crypto.subtle)) {
    throw new Error('이 브라우저에서는 암호화 기능을 쓸 수 없습니다. https 주소로 열어 주세요.');
  }
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(id + '\u0000' + pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64ToBytes(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64ToBytes(PAYLOAD.iv), additionalData: enc.encode(PAYLOAD.aad) },
    key, b64ToBytes(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}

$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = $('#loginBtn'), msg = $('#loginMsg');
  msg.textContent = ''; btn.disabled = true; btn.textContent = '여는 중…';
  try {
    const data = await unlock($('#uid').value.trim(), $('#pw').value);
    DATA = data;
    $('#pw').value = '';
    openApp();
  } catch (e) {
    const em = (e && e.message) || '';
    msg.textContent = em.indexOf('암호화 기능') >= 0 ? em : '아이디 또는 비밀번호가 맞지 않습니다.';
    $('#pw').value = ''; $('#pw').focus();
  } finally {
    btn.disabled = false; btn.textContent = '열기';
  }
});

function openApp() {
  $('#lock').hidden = true;
  $('#app').hidden = false;
  $('#hdrSub').textContent = DATA.meta.title + ' · ' + num(DATA.meta.transaction_count) + '건';
  renderAnnual(); renderMonth(11); renderAssets();
  bindTabs();
  resetLockTimer();
}
function lockNow() {
  DATA = null;
  $('#app').hidden = true;
  ['#tab-annual', '#tab-month', '#tab-assets'].forEach(s => $(s).innerHTML = '');
  $('#lock').hidden = false;
  $('#uid').value = ''; $('#pw').value = ''; $('#loginMsg').textContent = '';
  clearTimeout(lockTimer);
}
function resetLockTimer() {
  clearTimeout(lockTimer);
  lockTimer = setTimeout(lockNow, 20 * 60 * 1000);
}
['click', 'keydown', 'touchstart'].forEach(e => document.addEventListener(e, () => { if (DATA) resetLockTimer(); }, { passive: true }));

function bindTabs() {
  $$('#tabs button').forEach(b => {
    b.onclick = () => {
      $$('#tabs button').forEach(x => x.classList.toggle('active', x === b));
      ['annual', 'month', 'assets'].forEach(t => $('#tab-' + t).hidden = (t !== b.dataset.tab));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  });
  const lock = $('#lockBtn'); if (lock) lock.onclick = lockNow;
}

/* ── 툴팁 ───────────────────────────────────────────── */
const tip = $('#tip');
function bindTips(root) {
  $$('[data-tip]', root).forEach(el => {
    const show = e => {
      tip.textContent = el.dataset.tip; tip.style.opacity = 1;
      const r = el.getBoundingClientRect();
      tip.style.left = Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2)) + 'px';
      tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + 'px';
    };
    const hide = () => { tip.style.opacity = 0; };
    el.addEventListener('mouseenter', show); el.addEventListener('mouseleave', hide);
    el.addEventListener('touchstart', show, { passive: true }); el.addEventListener('touchend', hide);
  });
}

/* ── 차트 ───────────────────────────────────────────── */
function barLineChart(rows, opts) {
  // rows: [{m, a, b}]  a=수입 b=지출
  const W = 740, H = 300, PL = 46, PR = 14, PT = 18, PB = 34;
  const iw = W - PL - PR, ih = H - PT - PB;
  const maxV = Math.max(1, ...rows.map(r => Math.max(r.a, r.b)));
  const step = Math.pow(10, Math.floor(Math.log10(maxV))) / 2;
  const top = Math.ceil(maxV / step) * step;
  const y = v => PT + ih - (v / top) * ih;
  const band = iw / rows.length;
  const bw = Math.min(16, band * 0.30);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = top * i / 4, yy = y(v);
    g += `<line x1="${PL}" x2="${W - PR}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${PL - 8}" y="${yy + 4}" text-anchor="end" font-size="10" fill="var(--ink2)">${short(v)}</text>`;
  }
  let bars = '';
  rows.forEach((r, i) => {
    const cx = PL + band * i + band / 2;
    const ah = Math.max(2, (r.a / top) * ih), bh = Math.max(2, (r.b / top) * ih);
    bars += `<rect data-tip="${r.m}월 수입 ${won(r.a)}" x="${cx - bw - 2}" y="${y(r.a)}" width="${bw}" height="${ah}" rx="3" fill="var(--accent)"/>`;
    bars += `<rect data-tip="${r.m}월 지출 ${won(r.b)}" x="${cx + 2}" y="${y(r.b)}" width="${bw}" height="${bh}" rx="3" fill="var(--warn)"/>`;
    bars += `<text x="${cx}" y="${H - PB + 16}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${r.m}월</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 수입과 지출">${g}${bars}</svg>`;
}

function netBars(rows) {
  // 순액: 0선 기준 위(흑자)/아래(적자)
  const W = 740, H = 170, PL = 46, PR = 14, PT = 14, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;
  const maxAbs = Math.max(1, ...rows.map(r => Math.abs(r.v)));
  const zero = PT + ih / 2;
  const band = iw / rows.length, bw = Math.min(20, band * 0.42);
  let s = `<line x1="${PL}" x2="${W - PR}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>`;
  rows.forEach((r, i) => {
    const cx = PL + band * i + band / 2;
    const h = (Math.abs(r.v) / maxAbs) * (ih / 2 - 4);
    const y = r.v >= 0 ? zero - h : zero;
    s += `<rect data-tip="${r.m}월 순액 ${won(r.v)}" x="${cx - bw / 2}" y="${y}" width="${bw}" height="${Math.max(1.5, h)}" rx="3" fill="${r.v >= 0 ? 'var(--pos)' : 'var(--neg)'}"/>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${r.m}월</text>`;
  });
  s += `<text x="${PL - 8}" y="${zero + 4}" text-anchor="end" font-size="10" fill="var(--ink2)">0</text>`;
  s += `<text x="${PL - 8}" y="${PT + 10}" text-anchor="end" font-size="10" fill="var(--ink2)">${short(maxAbs)}</text>`;
  s += `<text x="${PL - 8}" y="${PT + ih - 2}" text-anchor="end" font-size="10" fill="var(--ink2)">-${short(maxAbs)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 순액">${s}</svg>`;
}

function donut(items, size = 200) {
  const total = items.reduce((s, i) => s + i.value, 0) || 1;
  const R = size / 2, r = R * 0.62, cx = R, cy = R;
  let a0 = -Math.PI / 2, paths = '';
  items.forEach((it, idx) => {
    const a1 = a0 + (it.value / total) * Math.PI * 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (ang, rad) => [cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad];
    const [x0, y0] = p(a0, R - 4), [x1, y1] = p(a1, R - 4), [x2, y2] = p(a1, r), [x3, y3] = p(a0, r);
    paths += `<path data-tip="${esc(it.name)} ${won(it.value)} (${pct(it.value / total)})" d="M${x0} ${y0} A${R - 4} ${R - 4} 0 ${large} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${large} 0 ${x3} ${y3} Z" fill="${it.color}"/>`;
    a0 = a1;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:0 auto" role="img">
    ${paths}<text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="11" fill="var(--ink2)">총 지출</text>
    <text x="${cx}" y="${cy + 15}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${short(total)}</text></svg>`;
}

function stackedBars(series, months) {
  // series: [{name, color, byMonth:[...]}]
  const W = 740, H = 240, PL = 44, PR = 12, PT = 14, PB = 28;
  const iw = W - PL - PR, ih = H - PT - PB;
  const totals = months.map((_, i) => series.reduce((s, k) => s + (k.byMonth[i] || 0), 0));
  const rawMax = Math.max(1, ...totals);
  const step = Math.pow(10, Math.floor(Math.log10(rawMax))) / 2;
  const maxV = Math.ceil(rawMax / step) * step;
  const y = v => PT + ih - (v / maxV) * ih;
  const band = iw / months.length, bw = Math.min(22, band * 0.5);
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const v = maxV * i / 3, yy = y(v);
    g += `<line x1="${PL}" x2="${W - PR}" y1="${yy}" y2="${yy}" stroke="var(--line)"/>`;
    g += `<text x="${PL - 8}" y="${yy + 4}" text-anchor="end" font-size="10" fill="var(--ink2)">${short(v)}</text>`;
  }
  let bars = '';
  months.forEach((m, i) => {
    const cx = PL + band * i + band / 2;
    let acc = 0;
    series.forEach(k => {
      const v = k.byMonth[i] || 0; if (v <= 0) return;
      const h = (v / maxV) * ih;
      bars += `<rect data-tip="${m}월 ${esc(k.name)} ${won(v)}" x="${cx - bw / 2}" y="${y(acc + v)}" width="${bw}" height="${Math.max(1.5, h)}" rx="2" fill="${k.color}"/>`;
      acc += v;
    });
    bars += `<text x="${cx}" y="${H - PB + 16}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${m}월</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${bars}</svg>`;
}

function hbars(items, total, color = 'var(--accent)') {
  return `<div class="rows">${items.map((it, i) => `
    <div class="row">
      <div class="track">
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="nm">${esc(it.name)}</span>
        <span class="amt">${won(it.value)}</span></div>
        <div class="bar"><i style="width:${Math.max(1, (it.value / (total || 1)) * 100)}%;background:${color}"></i></div>
        <div style="font-size:10.5px;color:var(--ink2);margin-top:3px">${pct(it.value / (total || 1))}</div>
      </div>
    </div>`).join('')}</div>`;
}

function dailyBars(tx, month) {
  const days = new Date(2026, month, 0).getDate();
  const arr = new Array(days).fill(0);
  tx.forEach(t => { if (t.section !== 'income' && t.date && t.date.slice(5, 7) === String(month).padStart(2, '0')) arr[+t.date.slice(8, 10) - 1] += t.amount; });
  const maxV = Math.max(1, ...arr);
  const W = 740, H = 110, PL = 6, PR = 6, PT = 8, PB = 16;
  const iw = W - PL - PR, ih = H - PT - PB, band = iw / days;
  let s = '';
  arr.forEach((v, i) => {
    const h = (v / maxV) * ih;
    s += `<rect data-tip="${month}월 ${i + 1}일 ${won(v)}" x="${PL + band * i + 1}" y="${PT + ih - Math.max(1.5, h)}" width="${band - 2.4}" height="${Math.max(1.5, h)}" rx="2" fill="${v > 0 ? 'var(--accent)' : 'var(--line)'}" opacity="${v > 0 ? .9 : .5}"/>`;
    if ((i + 1) % 5 === 0) s += `<text x="${PL + band * i + band / 2}" y="${H - 3}" text-anchor="middle" font-size="9" fill="var(--ink2)">${i + 1}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 지출">${s}</svg>`;
}

const PAGE = 40;
function paintTable() {
  const m = DATA.months.find(x => x.month === curMonth);
  let rows = m.transactions.slice();
  const q = filters.q.trim().toLowerCase();
  if (q) rows = rows.filter(t => (t.name + ' ' + t.cat + ' ' + (t.sub || '') + ' ' + (t.card || '')).toLowerCase().includes(q));
  if (filters.section) rows = rows.filter(t => t.section === filters.section);
  if (filters.cat) rows = rows.filter(t => t.cat === filters.cat);
  if (filters.kind) rows = rows.filter(t => t.kind === filters.kind);
  rows.sort((a, b) => {
    if (sortKey === 'amount') return (a.amount - b.amount) * sortDir;
    if (sortKey === 'name') return a.name.localeCompare(b.name, 'ko') * sortDir;
    return ((a.date || '9999') < (b.date || '9999') ? -1 : (a.date || '9999') > (b.date || '9999') ? 1 : 0) * sortDir;
  });
  const pages = Math.max(1, Math.ceil(rows.length / PAGE));
  page = Math.min(Math.max(1, page), pages);
  const slice = rows.slice((page - 1) * PAGE, page * PAGE);
  const secLabel = { income: '수입', fixed: '고정', variable: '변동', savings: '저축' };
  $('#txBody').innerHTML = slice.map(t => `<tr>
      <td style="white-space:nowrap;color:var(--ink2)">${t.date ? t.date.slice(5).replace('-', '/') : '-'}</td>
      <td>${esc(t.name)}${t.note ? `<span class="cat">${esc(t.note.slice(0, 40))}</span>` : ''}</td>
      <td><span class="pill ${t.section === 'income' ? 'green' : 'gray'}">${secLabel[t.section] || ''}</span>
        <span class="cat">${esc(t.cat)}${t.sub ? ' · ' + esc(t.sub) : ''}</span></td>
      <td style="white-space:nowrap;color:var(--ink2);font-size:11.5px">${esc(t.kind || '-')}${t.card ? `<span class="cat">${esc(t.card)}</span>` : ''}</td>
      <td class="num" style="color:${t.section === 'income' ? 'var(--pos)' : 'var(--ink)'}">${t.section === 'income' ? '+' : ''}${num(t.amount)}</td>
    </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--ink2);padding:24px">조건에 맞는 내역이 없습니다</td></tr>';
  const sum = rows.reduce((s, t) => s + (t.section === 'income' ? t.amount : -t.amount), 0);
  $('#txSum').textContent = (sum >= 0 ? '+' : '−') + num(Math.abs(sum)) + '원';
  $('#txSum').style.color = sum >= 0 ? 'var(--pos)' : 'var(--neg)';
  $('#pageInfo').textContent = `${rows.length}건 중 ${(page - 1) * PAGE + (rows.length ? 1 : 0)}–${Math.min(page * PAGE, rows.length)} · ${page}/${pages}`;
  $('#prevPage').disabled = page <= 1; $('#nextPage').disabled = page >= pages;
  bindTips($('#tab-month'));
}

/* ── 자산·부채 ──────────────────────────────────────── */
function renderAssets() {
  const A = DATA.assets, R = DATA.recurring;
  const filledRows = Object.entries(A.filled || {}).map(([k, v]) => `<div class="row"><span class="nm">${esc(k)}</span>
    <span class="amt" style="color:${v ? 'var(--pos)' : 'var(--ink2)'}">${v ? v + '건 입력' : '미입력'}</span></div>`).join('');
  const loanRow = l => `<div class="row" style="align-items:flex-start">
      <span class="nm">${esc(l.name)}<small>11개월 합계 ${won(l.total)} · 월평균 ${won(l.total / 11)}</small></span>
      <span class="mini" style="width:130px">${l.by_month.map(v => `<i data-tip="${won(v)}" style="height:${Math.max(2, (v / Math.max(...l.by_month, 1)) * 26)}px"></i>`).join('')}</span>
      <span class="amt">${short(l.total)}</span></div>`;
  const savingTx = DATA.months.flatMap(m => m.transactions.filter(t => t.section === 'savings').map(t => ({ ...t, m: m.month })));

  $('#tab-assets').innerHTML = `
  <div class="grid cols4">
    <div class="card kpi"><div class="label">총 자산</div><div class="value">—</div><div class="meta">원본 시트 미입력</div></div>
    <div class="card kpi"><div class="label">총 부채</div><div class="value">—</div><div class="meta">원본 시트 미입력</div></div>
    <div class="card kpi"><div class="label">순자산</div><div class="value">—</div><div class="meta">계산 불가</div></div>
    <div class="card kpi"><div class="label">1~11월 저축성지출</div><div class="value">${num(DATA.annual.savings)}</div><div class="meta">저축·투자로 나간 돈</div></div>
  </div>

  <div class="card sec">
    <div class="notice"><b>자산·부채 수치는 이 파일에 들어 있지 않습니다.</b><br>
      원본의 ‘자산현황 · 계좌현황 · 부채관리 · 예금/적금/투자/비상금관리’ 시트가 모두 비어 있어(금액 0, 일부 #VALUE!) 총자산·총부채·순자산을 계산할 수 없습니다.
      그 대신 가계부에 기록된 <b>대출 이자·보험료·교육비 흐름</b>을 아래에 정리했습니다.</div>
    <div class="rows" style="margin-top:12px">${filledRows}</div>
  </div>

  <div class="card sec">
    <h3>대출·이자 월별 흐름</h3><div class="hint">고정지출에 기록된 대출 이자 · 11개월</div>
    <div class="rows">${R.loans.map(loanRow).join('')}</div>
    <div class="totline"><span>대출 이자 합계</span><b>${won(R.loans.reduce((s, x) => s + x.total, 0))}</b></div>
  </div>

  <div class="grid cols2 sec">
    <div class="card"><h3>보험료</h3><div class="hint">의료비 · 보험료 항목</div>
      <div class="rows">${R.insurance.slice(0, 8).map(l => `<div class="row"><span class="nm">${esc(l.name)}</span><span class="amt">${won(l.total)}</span></div>`).join('')}</div></div>
    <div class="card"><h3>교육비</h3><div class="hint">소분류별 11개월 합계</div>
      <div class="rows">${R.education.map(l => `<div class="row"><span class="nm">${esc(l.name)}</span><span class="amt">${won(l.total)}</span></div>`).join('')}</div></div>
  </div>

  <div class="card sec">
    <h3>저축성지출 내역</h3><div class="hint">연금·투자 등 저축으로 분류된 기록 ${savingTx.length}건</div>
    <div class="rows">${savingTx.sort((a, b) => b.amount - a.amount).map(t => `<div class="row">
      <span class="pill gray">${t.m}월</span><span class="nm">${esc(t.name)}<small>${esc(t.cat)} · ${t.date || '-'}</small></span>
      <span class="amt">${won(t.amount)}</span></div>`).join('') || '<div class="row">기록 없음</div>'}</div>
  </div>`;
  bindTips($('#tab-assets'));
}

/* ── 시작 ───────────────────────────────────────────── */
initTheme();
$('#lockSub').textContent = META.title + ' · 암호화된 기록';
if (!(window.crypto && window.crypto.subtle)) {
  $('#loginMsg').textContent = '이 환경에서는 암호화 기능을 쓸 수 없습니다. https 주소로 열어 주세요.';
}
</script>
</body>
</html>
